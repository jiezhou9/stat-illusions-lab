<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Statistical Illusions Lab</title>
  <desc id="desc">A dark navy banner with the title Statistical Illusions Lab in English and Chinese, and an illustration of five confidence intervals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101B33"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <circle cx="1080" cy="24" r="150" fill="#E76F51" fill-opacity="0.16" filter="url(#blur)"/>
  <circle cx="680" cy="420" r="180" fill="#2A9D8F" fill-opacity="0.12" filter="url(#blur)"/>

  <g transform="translate(80, 88)">
    <rect x="0" y="0" width="48" height="4" rx="2" fill="#E76F51"/>
    <text x="62" y="6" fill="#E9C46A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">INTERACTIVE STATISTICS</text>

    <text x="0" y="112" fill="#F7F4EC" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="-2">STATISTICAL</text>
    <text x="0" y="178" fill="#E76F51" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="-2">ILLUSIONS LAB</text>

    <text x="0" y="232" fill="#F7F4EC" fill-opacity="0.88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="27" font-weight="600" letter-spacing="2">统计错觉实验室</text>
    <text x="0" y="270" fill="#F7F4EC" fill-opacity="0.52" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="0.6">Five experiments. One habit: question the number.</text>
  </g>

  <g transform="translate(800, 58)" filter="url(#shadow)">
    <rect width="328" height="304" rx="18" fill="#16233F" stroke="#334463" stroke-width="1.2"/>
    <text x="26" y="42" fill="#F7F4EC" fill-opacity="0.58" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2.4">THE LAB · 05 EXPERIMENTS</text>

    <line x1="26" y1="62" x2="302" y2="62" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#F7F4EC" fill-opacity="0.38">
      <text x="26" y="94">01</text>
      <text x="26" y="136">02</text>
      <text x="26" y="178">03</text>
      <text x="26" y="220">04</text>
      <text x="26" y="262">05</text>
    </g>

    <g stroke-width="2.4" stroke-linecap="round">
      <line x1="84" y1="90" x2="236" y2="90" stroke="#2A9D8F" stroke-opacity="0.8"/>
      <line x1="101" y1="132" x2="272" y2="132" stroke="#2A9D8F" stroke-opacity="0.8"/>
      <line x1="70" y1="174" x2="221" y2="174" stroke="#E76F51" stroke-opacity="0.9"/>
      <line x1="96" y1="216" x2="259" y2="216" stroke="#2A9D8F" stroke-opacity="0.8"/>
      <line x1="128" y1="258" x2="285" y2="258" stroke="#E9C46A" stroke-opacity="0.9"/>
    </g>

    <g stroke-width="2.4" stroke-linecap="round">
      <line x1="84" y1="84" x2="84" y2="96" stroke="#2A9D8F"/>
      <line x1="236" y1="84" x2="236" y2="96" stroke="#2A9D8F"/>
      <line x1="101" y1="126" x2="101" y2="138" stroke="#2A9D8F"/>
      <line x1="272" y1="126" x2="272" y2="138" stroke="#2A9D8F"/>
      <line x1="70" y1="168" x2="70" y2="180" stroke="#E76F51"/>
      <line x1="221" y1="168" x2="221" y2="180" stroke="#E76F51"/>
      <line x1="96" y1="210" x2="96" y2="222" stroke="#2A9D8F"/>
      <line x1="259" y1="210" x2="259" y2="222" stroke="#2A9D8F"/>
      <line x1="128" y1="252" x2="128" y2="264" stroke="#E9C46A"/>
      <line x1="285" y1="252" x2="285" y2="264" stroke="#E9C46A"/>
    </g>

    <g fill="#F7F4EC">
      <circle cx="160" cy="90" r="3.6"/>
      <circle cx="186" cy="132" r="3.6"/>
      <circle cx="146" cy="174" r="3.6"/>
      <circle cx="178" cy="216" r="3.6"/>
      <circle cx="207" cy="258" r="3.6"/>
    </g>

    <line x1="26" y1="282" x2="302" y2="282" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="26" y="292" fill="#F7F4EC" fill-opacity="0.34" font-family="Segoe UI, Arial, sans-serif" font-size="9" letter-spacing="1.2">SIMULATE · QUESTION · UNDERSTAND</text>
  </g>
</svg>
